workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

stages:
  - validate
  - test
  - package
  - secure
  - govern
  - deploy
  - monitor
  - evidence

default:
  image: alpine:3.20
  interruptible: true
  before_script:
    - set -eu

variables:
  GIT_DEPTH: "20"
  STILL_MONITOR_MAX_REQUESTS: "3"
  STILL_MONITOR_TIMEOUT_SECONDS: "5"

validate:
  stage: validate
  image: alpine:3.20
  script:
    - apk add --no-cache jq
    - mkdir -p validation
    - sh gitlab/flows/validate-contract.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - validation/

test:
  stage: test
  image: rust:latest
  script:
    - printf '%s\n' 'status=BLOCKED' 'reason=Rust workspace manifest is not present in this checkout' > test-status.txt
    - if [ ! -f Cargo.toml ]; then cat test-status.txt; exit 1; fi
    - cargo test --workspace
    - printf '%s\n' 'status=PASS' 'command=cargo test --workspace' > test-status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-status.txt

test_web:
  stage: test
  image: node:22-bookworm-slim
  script:
    - printf '%s\n' 'status=BLOCKED' 'reason=Next package manifest is not present in this checkout' > web-test-status.txt
    - if [ ! -f apps/web/package.json ] || [ ! -f apps/web/package-lock.json ]; then cat web-test-status.txt; exit 1; fi
    - cd apps/web
    - npm install --no-audit
    - npm test
    - npm run typecheck
    - cd ../..
    - printf '%s\n' 'status=PASS' 'commands=npm test; npm run typecheck' > web-test-status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - web-test-status.txt

package:
  stage: package
  script:
    - mkdir -p package
    - sh infra/docker/package.sh --validate-only | tee package/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

secure:
  stage: secure
  script:
    - mkdir -p security
    - sh gitlab/flows/security-check.sh | tee security/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - security/

govern:
  stage: govern
  script:
    - mkdir -p govern
    - sh gitlab/flows/govern-release.sh | tee govern/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - govern/
  environment:
    name: still-governance
  rules:
    - if: '$STILL_RUN_GOVERN == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

deploy_candidate:
  stage: deploy
  resource_group: still-candidate
  script:
    - mkdir -p deploy
    - apk add --no-cache curl
    - sh gitlab/flows/deploy-candidate.sh | tee deploy/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - deploy/
  environment:
    name: still-candidate
    url: $STILL_CANDIDATE_URL
  rules:
    - if: '$STILL_RUN_DEPLOY == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

smoke_monitor:
  stage: monitor
  script:
    - mkdir -p monitor
    - apk add --no-cache curl
    - sh gitlab/flows/smoke-monitor.sh | tee monitor/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - monitor/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$STILL_RUN_SMOKE == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

duo_repair_trigger:
  stage: monitor
  script:
    - mkdir -p duo
    - apk add --no-cache curl jq
    - sh gitlab/flows/duo-trigger.sh | tee duo/status.txt
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - duo/
  rules:
    - if: '$STILL_RUN_DUO_REPAIR == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
    - when: never

evidence_publication:
  stage: evidence
  when: always
  script:
    - mkdir -p evidence
    - sh gitlab/flows/publish-evidence.sh
  artifacts:
    when: always
    expose_as: "STILL CI evidence"
    expire_in: 30 days
    paths:
      - evidence/
