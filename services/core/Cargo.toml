[package]
name = "still-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "=0.6.20"
chrono = { version = "=0.4.26", features = ["serde"] }
serde = { version = "=1.0.188", features = ["derive"] }
serde_json = "=1.0.107"
sqlx = { version = "=0.6.3", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros"] }
still-domain = { path = "../../crates/domain" }
still-journey-contract = { path = "../../crates/journey-contract" }
thiserror = "=1.0.49"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "=0.3.5", features = ["cors", "trace"] }
tracing = "=0.1.37"
tracing-subscriber = { version = "=0.3.17", features = ["env-filter"] }
